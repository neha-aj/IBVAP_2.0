[project]
name = "ibvap-common"
version = "0.1.0"
description = "Shared cross-cutting code for IBVAP microservices (auth, logging, errors, config, db). Never import a sibling service's package directly -- this library is the only shared code path."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "fastapi>=0.111",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    "structlog>=24.1",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ibvap_common*"]

[tool.setuptools.package-data]
# PEP 561: marks this package as carrying its own inline type hints, so
# every service that imports it gets real type checking instead of
# mypy silently skipping it as untyped (Phase 2 M24).
ibvap_common = ["py.typed"]
