user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # M10 hardening: per-client-IP request-rate limiting at the gateway --
    # one place for every service, rather than middleware repeated in each.
    # `login` is deliberately far stricter than general API traffic (brute-
    # force protection matters there in a way it doesn't for, say, polling
    # the dashboard); MJPEG streaming (`/stream/`) and the WebSocket
    # endpoint (`/ws`) are long-lived connections, not repeated discrete
    # requests, so neither zone is applied to them.
    limit_req_zone $binary_remote_addr zone=auth_login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
    limit_req_status 429;

    # Explicit filename, not a `*.conf` wildcard: since M11 switched conf.d
    # from a direct host bind-mount to nginx's own envsubst-on-templates
    # step (needed for CORS_ALLOWED_ORIGIN substitution), the base image's
    # own stock /etc/nginx/conf.d/default.conf is no longer hidden by a
    # bind mount over the whole directory -- it physically exists alongside
    # our generated file. A wildcard include would pull it in too (a second
    # default server on :80). Naming the one file we actually want avoids
    # that regardless of what else envsubst generates into conf.d.
    include /etc/nginx/conf.d/api-gateway.conf;
}
