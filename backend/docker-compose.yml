      context: .
      dockerfile: services/ledger-service/Dockerfile
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      <<: *common-env
      SERVICE_NAME: ledger-service
      DB_SCHEMA: ledger
    volumes:
