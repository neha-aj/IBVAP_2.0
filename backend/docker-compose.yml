version: "3.9"

x-common-env: &common-env
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_HOST: ${POSTGRES_HOST}
  POSTGRES_PORT: ${POSTGRES_PORT}
  REDIS_HOST: ${REDIS_HOST}
  REDIS_PORT: ${REDIS_PORT}
  JWT_SECRET: ${JWT_SECRET}
  JWT_ALGORITHM: ${JWT_ALGORITHM}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS}
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}

networks:
  ibvap-internal:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  media-data:
  ledger-data:
  nginx-certs:
  detection-models:
  prometheus-data:
  grafana-data:

services:
  postgres:
    # Phase 2 M16 (Person/Vehicle Re-ID) needs the pgvector extension for
    # embedding similarity search -- this image is postgres:16 with pgvector
    # compiled in, otherwise identical (same data directory format, same
    # binary ABI within the major version), so swapping the tag on the
    # existing volume is safe and doesn't require a data migration.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Bound to loopback only -- every service reaches postgres over the
      # internal ibvap-internal network by hostname, not this host-mapped
      # port; this only exists for a local DB client (pgAdmin, psql) on
      # this machine. 127.0.0.1: keeps that working while making the port
      # unreachable from the network/another machine.
      - "127.0.0.1:5432:5432"
    networks: [ibvap-internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      # Same reasoning as postgres above -- loopback-only.
      - "127.0.0.1:6379:6379"
    networks: [ibvap-internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    restart: unless-stopped
    # M2.0 security review follow-up: app containers already run as a
    # non-root USER (Dockerfile); dropping all Linux capabilities and
    # blocking privilege escalation is a standard, low-risk extra layer --
    # these are plain Python services with no need for any capability.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      <<: *common-env
      SERVICE_NAME: auth-service
      DB_SCHEMA: auth
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ibvap-internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  camera-service:
    build:
      context: .
      dockerfile: services/camera-service/Dockerfile
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      <<: *common-env
      SERVICE_NAME: camera-service
      DB_SCHEMA: camera
      MEDIA_SERVICE_URL: http://media-service:8000
      INGESTION_SERVICE_URL: http://ingestion-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      media-service:
        condition: service_healthy
    networks: [ibvap-internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ingestion-service:
    build:
      context: .
      dockerfile: services/ingestion-service/Dockerfile
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      <<: *common-env
      SERVICE_NAME: ingestion-service
      CAMERA_SERVICE_URL: http://camera-service:8000
    volumes:
      - media-data:/data/media:ro
    # Uncomment to give the container access to a host webcam (Linux hosts):
    # devices:
    #   - /dev/video0:/dev/video0
    depends_on:
      redis:
        condition: service_healthy
      camera-service:
        condition: service_healthy
    networks: [ibvap-internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  detection-service:
    build:
      context: .
      dockerfile: services/detection-service/Dockerfile
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      <<: *common-env
      SERVICE_NAME: detection-service
      CAMERA_SERVICE_URL: http://camera-service:8000
    volumes:
      - detection-models:/srv/models
    depends_on:
      redis:
        condition: service_healthy
      camera-service:
        condition: service_healthy
      ingestion-service:
        condition: service_healthy
    networks: [ibvap-internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Ultralytics downloads yolov8n.pt on first inference call; give it
      # room before the healthcheck starts counting failures.
      start_period: 60s

  tracking-service:
