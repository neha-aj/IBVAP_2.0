      interval: 10s
      timeout: 5s
      retries: 5

  realtime-gateway:
    build:
      context: .
      dockerfile: services/realtime-gateway/Dockerfile
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      <<: *common-env
      SERVICE_NAME: realtime-gateway
    depends_on:
      redis:
        condition: service_healthy
    networks: [ibvap-internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  analytics-service:
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      <<: *common-env
      SERVICE_NAME: analytics-service
      DB_SCHEMA: analytics
      CAMERA_SERVICE_URL: http://camera-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Reads across camera/events schemas directly (SAS §3) -- needs their
      # tables to already exist, so their migrations must have run first.
      camera-service:
        condition: service_healthy
      event-alert-service:
        condition: service_healthy
    networks: [ibvap-internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # M25 hardening: generates a self-signed TLS cert (if one isn't already
    # in the persisted nginx-certs volume) before handing off to the
    # image's own normal entrypoint, which still does its usual envsubst-
    # on-templates step and starts nginx exactly as before. Invoked via
    # `sh` explicitly rather than relying on the executable bit, since a
    # Windows bind mount doesn't reliably preserve it.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sh /entrypoint-extra/generate-certs.sh && exec /docker-entrypoint.sh nginx -g 'daemon off;'
    environment:
      # M25: "127.0.0.1", not "localhost" -- the refresh cookie's SameSite=Lax
      # policy treats them as different sites (no shared eTLD+1), which
      # silently drops the cookie on a cross-origin fetch/XHR even though a
      # plain page load wouldn't notice. Frontend and API must be reached via
      # the same hostname for the cookie to actually be sent back.
      - CORS_ALLOWED_ORIGIN=${CORS_ALLOWED_ORIGIN:-http://127.0.0.1:5173}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # conf.d itself is generated at container start by nginx's own
      # docker-entrypoint (envsubst on every *.template file found here into
      # /etc/nginx/conf.d) -- this lets CORS_ALLOWED_ORIGIN above reach the
      # config without hardcoding it, unlike the old direct conf.d:ro mount.
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/entrypoint-extra:/entrypoint-extra:ro
      - nginx-certs:/etc/nginx/certs
      - media-data:/data/media:ro
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - auth-service
      - camera-service
      - ingestion-service
      - detection-service
      - tracking-service
      - event-alert-service
      - media-service
      - realtime-gateway
      - analytics-service
    networks: [ibvap-internal]

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks: [ibvap-internal]

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks: [ibvap-internal]
