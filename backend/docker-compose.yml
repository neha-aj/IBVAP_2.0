      CAMERA_SERVICE_URL: http://camera-service:8000
      INGESTION_SERVICE_URL: http://ingestion-service:8000
      MEDIA_SERVICE_URL: http://media-service:8000
      EVENT_ALERT_SERVICE_URL: http://event-alert-service:8000
    depends_on:
