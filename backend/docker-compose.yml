        condition: service_healthy
      camera-service:
        condition: service_healthy
      detection-service:
        condition: service_healthy
    networks: [ibvap-internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  event-alert-service:
