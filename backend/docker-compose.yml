  media-service:
    build:
      context: .
      dockerfile: services/media-service/Dockerfile
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      <<: *common-env
      SERVICE_NAME: media-service
      DB_SCHEMA: media
      MEDIA_ROOT: /data/media
      # M25: best-effort independent anchoring -- media-service works fine
      # if ledger-service is unreachable (see app/services/ledger_service.py's
      # own docstring), so this is only a URL, not a hard `depends_on` below.
      LEDGER_SERVICE_URL: http://ledger-service:8000
    volumes:
      - media-data:/data/media
    depends_on:
      postgres:
        condition: service_healthy
    networks: [ibvap-internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
