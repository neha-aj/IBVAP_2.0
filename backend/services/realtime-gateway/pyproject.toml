[project]
name = "realtime-gateway"
version = "0.1.0"
description = "IBVAP Realtime Gateway -- single WebSocket endpoint, topic subscription, per-connection auth, fans out Redis Pub/Sub to connected clients (SAS §3, §8, API Spec §8)"
requires-python = ">=3.12"
dependencies = [
    "ibvap-common",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "redis>=5.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
]

[tool.uv.sources]
ibvap-common = { path = "../../libs/ibvap_common" }

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
