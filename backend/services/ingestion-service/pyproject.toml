[project]
name = "ingestion-service"
version = "0.1.0"
description = "IBVAP Stream Ingestion Service -- opens file/webcam/usb/rtsp/ip sources, publishes frames to Redis Streams, serves live MJPEG preview, reports camera health (SAS §3, §5.1)"
requires-python = ">=3.12"
dependencies = [
    "ibvap-common",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "redis>=5.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "prometheus-client>=0.20",
]

[tool.uv.sources]
ibvap-common = { path = "../../libs/ibvap_common" }

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
