[project]
name = "detection-service"
version = "0.1.0"
description = "IBVAP Detection Service -- consumes frames from cam:{id}:frames, runs YOLO inference, publishes normalized bbox detections matching the frontend DetectionOverlay contract (SAS §3, §5.2, API Spec §2/§4)"
requires-python = ">=3.12"
dependencies = [
    "ibvap-common",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "redis>=5.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "ultralytics>=8.2",
]

[tool.uv.sources]
ibvap-common = { path = "../../libs/ibvap_common" }

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]
onnx = ["onnxruntime>=1.18"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
