[project]
name = "camera-service"
version = "0.1.0"
description = "IBVAP Camera Management Service -- camera CRUD, sectors, Settings page, file/webcam registration (SAS §3, API Spec §2-3)"
requires-python = ">=3.12"
dependencies = [
    "ibvap-common",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "redis>=5.0",
    "structlog>=24.1",
    "httpx>=0.27",
]

[tool.uv.sources]
ibvap-common = { path = "../../libs/ibvap_common" }

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
